name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # One always-on job per Node version, so the required checks never sit pending;
  # on pull requests it decides internally which packages to run.
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.18.x
          - 24.x
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, test and verify affected packages
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          echo "Affected projects: $(pnpm exec nx show projects --affected --base="$BASE" --head=HEAD --json)"
          pnpm exec nx affected -t build test verify:package --base="$BASE" --head=HEAD

      - name: Build, test and verify all packages
        if: github.event_name != 'pull_request'
        run: pnpm exec nx run-many -t build test verify:package

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
